<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>生态鱼池 · 3D 锦鲤池</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E🐟%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="./css/style.css">
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/addons/" } }
</script>
</head>
<body>
<canvas id="c" aria-label="三维生态鱼池画布"></canvas>

<section id="eco" aria-label="鱼池生态">
  <div class="eco-head"><h1>生态鱼池<small>ECO KOI POND</small></h1><span id="clock">白天 12:00</span></div>
  <div class="meter"><label>水质</label><div class="bar"><i id="qBar"></i></div><b id="qVal">88</b><em id="qGrade" class="good">优</em></div>
  <div class="meter"><label>饱食度</label><div class="bar sat"><i id="sBar"></i></div><b id="sVal">70</b><em id="sGrade" class="good">适中</em></div>
  <div class="eco-foot"><span>锦鲤 <b id="nKoi">0</b></span><span>金鱼 <b id="nGold">0</b></span><span>植物 <b id="nPlant">0</b></span><span>承载 <b id="nCap">-</b></span></div>
  <div id="ecoTip"></div>
</section>

<div id="toast" role="status" aria-live="polite"></div>
<div id="toolStatus" hidden><span id="toolText"></span><button id="toolDone">完成</button></div>
<button id="exitImm" hidden>退出沉浸 <kbd>Esc</kbd></button>

<!-- Panels: only one open at a time -->
<div class="panel" id="p-life" role="dialog" aria-label="生物" hidden>
  <div class="phead"><span>生物</span><button class="pclose" aria-label="关闭">✕</button></div>
  <div class="prow"><label>锦鲤</label><div class="stepper"><button data-act="koi-" aria-label="减少锦鲤">−</button><span id="koiN">0</span><button data-act="koi+" aria-label="增加锦鲤">＋</button></div></div>
  <div class="sub">新增锦鲤的品种</div>
  <div class="seg wrap" id="patSeg"></div>
  <div class="prow"><label>金鱼</label><div class="stepper"><button data-act="gold-" aria-label="减少金鱼">−</button><span id="goldN">0</span><button data-act="gold+" aria-label="增加金鱼">＋</button></div></div>
  <div class="prow btns"><button class="primary" data-act="feedAll">撒一把鱼食</button><button data-act="clearFood">清理残饵</button></div>
  <p class="note">直接点击水面即可投喂，鱼会游过来抢食。没吃完的残饵约 50 秒后沉底，会拉低水质。</p>
</div>

<div class="panel" id="p-plant" role="dialog" aria-label="植物" hidden>
  <div class="phead"><span>植物</span><button class="pclose" aria-label="关闭">✕</button></div>
  <div class="tools" id="plantTools">
    <button data-plant="lily"><i class="ic ic-lily"></i>睡莲叶<small>水面</small></button>
    <button data-plant="lotus"><i class="ic ic-lotus"></i>荷花<small>水面</small></button>
    <button data-plant="reed"><i class="ic ic-reed"></i>芦苇<small>岸边浅水</small></button>
    <button data-plant="cattail"><i class="ic ic-cattail"></i>香蒲<small>岸边浅水</small></button>
  </div>
  <p class="note">选择植物后点击场景放置，可连续放置，按 Esc 或「完成」结束。水生植物能提高鱼池承载量、净化水质。</p>
  <div class="prow btns"><button data-act="undoPlant">撤销上一株</button><button data-act="clearPlant" class="danger">清空植物</button></div>
</div>

<div class="panel" id="p-env" role="dialog" aria-label="环境" hidden>
  <div class="phead"><span>环境</span><button class="pclose" aria-label="关闭">✕</button></div>
  <div class="prow col"><label>时间 <span id="todLabel">白天</span></label><input type="range" id="tod" min="0" max="100" value="0"><div class="ticks"><span>白天</span><span>黄昏</span><span>夜晚</span></div></div>
  <div class="prow"><label>自动昼夜</label><input type="checkbox" id="autoDay" class="sw"></div>
  <div class="prow col"><label>水体清澈度 <span id="clarV">70%</span></label><input type="range" id="clarity" min="0" max="100" value="70"></div>
  <div class="prow col"><label>天气 <span id="wxLabel">晴天</span></label>
    <select id="weather">
      <option value="sunny">晴天</option>
      <option value="cloudy">多云</option>
      <option value="drizzle">小雨</option>
      <option value="rain">中雨</option>
      <option value="fog">薄雾</option>
      <option value="snow">小雪</option>
    </select>
  </div>
  <div class="prow col"><label>天气强度 <span id="wxV">70%</span></label><input type="range" id="wxInt" min="0" max="100" value="70"></div>
  <div class="prow"><label>自动天气</label><input type="checkbox" id="autoWx" class="sw"></div>
  <div class="prow col"><label>微风 <span id="windV">40%</span></label><input type="range" id="wind" min="0" max="100" value="40"></div>
  <div class="prow"><label>夜晚萤火虫</label><input type="checkbox" id="flies" class="sw" checked></div>
  <div class="prow"><label>水面倒影 <span class="hint">（精美画质）</span></label><input type="checkbox" id="refl" class="sw" checked></div>
  <div class="prow"><label>画质</label><div class="seg" id="qualSeg"><button data-q="low">流畅</button><button data-q="high">精美</button></div></div>
  <div class="save-box">
    <div class="prow"><label>存档</label><span id="saveInfo" class="save-info">自动保存</span></div>
    <div class="prow btns"><button data-act="saveNow">立即保存</button><button id="resetBtn" class="danger">重置鱼池（清除存档）</button></div>
    <p class="note">鱼、植物、石头布局、环境设置和水质会自动保存在本浏览器中，刷新后恢复。地址加 <code>?fresh</code> 可忽略存档临时试玩。</p>
  </div>
</div>

<div class="panel" id="p-view" role="dialog" aria-label="视角" hidden>
  <div class="phead"><span>视角</span><button class="pclose" aria-label="关闭">✕</button></div>
  <div class="tools four">
    <button data-view="default"><i class="ic ic-home"></i>默认</button>
    <button data-view="top"><i class="ic ic-top"></i>俯视</button>
    <button data-view="close"><i class="ic ic-eye"></i>近景</button>
    <button data-view="low"><i class="ic ic-low"></i>池边</button>
  </div>
  <div class="prow"><label>自动环绕</label><input type="checkbox" id="autoRot" class="sw"></div>
  <div class="prow btns"><button class="primary" data-act="immersive">沉浸欣赏（隐藏界面）</button></div>
  <p class="note">拖动旋转视角，滚轮 / 双指缩放，右键或双指平移。</p>
</div>

<nav id="dock" aria-label="工具栏">
  <button data-panel="p-life"><svg viewBox="0 0 24 24"><path d="M3 12c3-5 9-6 13-2l5-3-1 5 1 5-5-3c-4 4-10 3-13-2z"/><circle cx="8" cy="11" r="1"/></svg><span>生物</span></button>
  <button data-panel="p-plant"><svg viewBox="0 0 24 24"><path d="M12 21V11M12 11c0-4 3-7 8-7 0 5-3 8-8 7zM12 14c0-3-2-6-7-6 0 4 2 6 7 6z"/></svg><span>植物</span></button>
  <button data-panel="p-env"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span>环境</span></button>
  <button data-panel="p-view"><svg viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><span>视角</span></button>
  <i class="dock-div"></i>
  <button id="feedBtn" data-act="feedAll" title="在鱼池随机撒一把鱼食"><svg viewBox="0 0 24 24"><circle cx="8" cy="9" r="1.6"/><circle cx="14" cy="7" r="1.6"/><circle cx="12" cy="13" r="1.6"/><circle cx="17" cy="12" r="1.6"/><path d="M3 18c3 2 15 2 18 0"/></svg><span>投喂</span></button>
</nav>

<div id="loading"><div class="ld-title">生态鱼池</div><div>正在注水、放鱼…</div></div>
<script type="module" src="./js/main.js"></script>
</body>
</html>
